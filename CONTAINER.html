<html>
    <head>
        <style>
            .container {
                display: grid;
                grid-template-columns: 80px 200px auto;
                grid-template-rows: 80px 200px auto;
                background-color: dodgerblue;
                padding: 10px;
            }
            .container div {
                background-color: #f1f1f1;
                border: 1px solid black;
                padding: 10px;
                font-size: 30px;
            }
            .container1 {
                display: grid;
                grid-template-columns: auto auto auto;
                column-gap: 10px;
                background-color: dodgerblue;
                padding: 10px;
            }

            .container3 div {
                background-color: #f1f1f1;

                padding: 10px;
                font-size: 30px;
            }
        </style>
    </head>
        <body>
            <h1> Grid Layout</h1>
            <p> A grid layout with 5 containers</p>
            <div class="container" align="center" >
